name: Build unsigned IPA

# 署名なしの .ipa を作って artifact として出力します。
# 署名とインストールは、手元の PC で Sideloadly が行います(Apple ID は GitHub に渡しません)。
# このワークフローは secrets を使いません。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Pull Git LFS files in submodules
        run: |
          git lfs install --local
          git submodule foreach --recursive 'git lfs pull'

      - name: Verify model files are real files (not LFS pointers)
        run: |
          ls -l zenz-v3.2-*-gguf/*.gguf
          for f in zenz-v3.2-*-gguf/*.gguf; do
            size=$(stat -f%z "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is too small ($size bytes); LFS content was not fetched"
              exit 1
            fi
          done

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-derived-data-${{ hashFiles('**/project.pbxproj', '**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-derived-data-

      - name: Build (unsigned)
        run: |
          xcodebuild build -project azooKey.xcodeproj \
                     -scheme MainApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -d "$APP" || { echo "::error::.app not found"; exit 1; }
          echo "app: $APP"
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/Keyboard.appex" || { echo "::error::Keyboard.appex is not embedded"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../my-Keyboard-unsigned.ipa Payload)
          ls -l build/my-Keyboard-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v7
        with:
          name: my-Keyboard-unsigned-ipa
          path: build/my-Keyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  # PR のビルドが終わったら、結果を PR にコメントします(成功でも失敗でも)。
  # GitHub の通知で自分に届き、Claude Code の Auto-fix が拾えるかを試すためのものです。
  notify:
    name: Comment build result on PR
    needs: build
    if: ${{ always() && github.event_name == 'pull_request' && needs.build.result != 'cancelled' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RESULT: ${{ needs.build.result }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post comment
        run: |
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ ビルド成功"
            DETAIL="署名なしの .ipa は、実行ページの Artifacts からダウンロードできます。"
          else
            STATUS="❌ ビルド失敗(${RESULT})"
            DETAIL="失敗したログは実行ページから確認できます。"
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"
          gh pr comment "$PR_NUMBER" --body "${STATUS} (${SHORT_SHA})

          ${DETAIL}
          実行ページ: ${RUN_URL}

          _このコメントは GitHub Actions が自動で投稿しています。_"
